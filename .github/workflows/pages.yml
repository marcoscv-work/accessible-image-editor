name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  cancel-in-progress: true
  group: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - env:
          BASE_PATH: /${{ github.event.repository.name }}/demo/
          BUILD_OUT_DIR: dist/demo
        run: npm run build

      - env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/storybook/
        run: npm run build:storybook

      # The website is the home page, so it lands at the root. The old
      # /website/ address stays alive as a redirect because it was shared.
      - run: |
          cp -r website/. dist/
          cp -r redirects/website dist/website

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
