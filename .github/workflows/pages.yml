name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  cancel-in-progress: true
  group: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/storybook/
        run: npm run build:storybook

      # The presentation is plain static files, so it only needs copying in
      # after both builds have written dist.
      - run: cp -r presentation dist/presentation

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
